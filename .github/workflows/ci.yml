name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: no job in this workflow writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: "123456789:ABCdefghIJKlmnoPQRstuvwxyz-DummyToken"
      GEMINI_API_KEY: ""
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: austro_ai
          POSTGRES_USER: austro
          POSTGRES_PASSWORD: austro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U austro -d austro_ai"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Byte-compile all modules
        run: python -m compileall -q app main.py handlers.py config.py database.py reminder_scheduler.py redaction.py smoke_test.py scripts tests

      - name: Lint with pyflakes
        run: python -m pyflakes main.py handlers.py config.py database.py reminder_scheduler.py redaction.py app tests scripts/staging_validate.py scripts/staging_rollback.py

      - name: Run tests
        run: pytest -v

      - name: Run Bandit SAST scan
        run: >-
          bandit -r app/ --severity-level medium --confidence-level medium
          -f txt


      - name: Run offline smoke test
        run: python smoke_test.py

      - name: Run PostgreSQL integration tests
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: austro
          DB_PASSWORD: austro_ci
          DB_TEST_NAME: austro_ai_pgtest
          DB_ADMIN_USER: austro
          DB_ADMIN_PASSWORD: austro_ci
        run: |
          set -o pipefail
          python -m pytest tests/test_repositories_pg.py -q --tb=short 2>&1 | tee /tmp/pg_results.log
          grep -q "18 passed" /tmp/pg_results.log || { echo "ERROR: Expected 18 passed"; exit 1; }
          grep -q "skipped" /tmp/pg_results.log && { echo "ERROR: Tests were skipped"; exit 1; } || true
          echo "PostgreSQL integration tests: 18 passed, 0 skipped"

      - name: Run evaluation regression harness
        env:
          BOT_TOKEN: "123456789:ABCdefghIJKlmnoPQRstuvwxyz-DummyToken"
          GEMINI_API_KEY: ""
        run: python scripts/verify.py

      # This step previously ran `pytest tests/test_security.py || echo skip`.
      # tests/test_security.py does not exist in the tree, so the `||` branch
      # always ran and CI reported success for a suite that never executed.
      # The security surface is now covered by files that DO exist, and the
      # step fails loudly if any of them goes missing.
      - name: Security tests
        run: |
          set -o pipefail
          files=(
            tests/test_redaction.py
            tests/test_docker_context.py
            tests/test_architecture.py
            tests/test_production_config.py
          )
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: expected security test file is missing: $f"
              exit 1
            fi
          done
          python -m pytest "${files[@]}" -v

      - name: Repository secret scan
        uses: trufflesecurity/trufflehog@v3.97.9
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

  staging:
    name: Staging stack (compose + images)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Non-secret stand-ins so `${VAR:?}` interpolation resolves. Never a real
      # credential: CI only needs compose to resolve and Docker to build.
      - name: Create a sanitized staging env file for CI
        run: |
          cp .env.staging.example .env.staging
          cat >> .env.staging <<'EOF'
          AUSTRO_ENVIRONMENT=staging
          BOT_TOKEN=000000000:CI-placeholder-not-a-real-token
          GEMINI_API_KEY=ci-placeholder-key
          DB_HOST=staging-db.internal.example
          DB_NAME=austro_ai_staging
          DB_USER=austro_staging
          DB_PASSWORD=ci-placeholder-password
          WEBHOOK_SECRET=ci-placeholder-webhook-secret
          EOF
          echo "sanitized .env.staging created (placeholder values only)"

      # A synthetic production env file so the isolation check has something to
      # compare against. Placeholder values only, and deliberately different.
      - name: Create a sanitized production env stand-in for comparison
        run: |
          cat > .env <<'EOF'
          AUSTRO_ENVIRONMENT=production
          BOT_TOKEN=111111111:CI-production-placeholder-token
          GEMINI_API_KEY=ci-production-placeholder-key
          DB_HOST=prod-db.internal.example
          DB_NAME=austro_ai
          DB_USER=austro
          DB_PASSWORD=ci-production-placeholder-password
          WEBHOOK_URL=https://example.com/webhook
          WEBHOOK_SECRET=ci-production-placeholder-webhook-secret
          EOF
          echo "sanitized .env stand-in created (placeholder values only)"

      - name: Validate the staging and production compose files
        run: |
          mkdir -p secrets
          head -c 32 /dev/urandom > secrets/backup_encryption_key
          head -c 32 /dev/urandom > secrets/staging_backup_encryption_key
          chmod 0400 secrets/*
          docker compose -f docker-compose.yml --env-file .env config -q
          docker compose -f docker-compose.staging.yml -p austro-staging \
            --env-file .env.staging config -q
          docker compose -f docker-compose.staging.yml -p austro-staging \
            --env-file .env.staging config --services
          echo "staging compose config: OK"

      - name: Staging env file must stay untracked
        run: |
          if git check-ignore -q .env.staging; then
            echo ".env.staging is git-ignored: OK"
          else
            echo "ERROR: .env.staging is not git-ignored"; exit 1
          fi
          if git check-ignore -q .env.staging.example; then
            echo "ERROR: .env.staging.example must be trackable"; exit 1
          fi
          echo ".env.staging.example is trackable: OK"

      - name: Staging isolation preflight (no Docker needed)
        run: python scripts/staging_validate.py --env-file .env.staging --static

      - name: Staging isolation preflight must reject shared production secrets
        run: |
          cp .env.staging .env.staging.bak
          echo "BOT_TOKEN=111111111:CI-production-placeholder-token" >> .env.staging
          if python scripts/staging_validate.py --env-file .env.staging --static; then
            echo "ERROR: a token shared with production was not rejected"; exit 1
          fi
          mv .env.staging.bak .env.staging
          echo "shared-secret rejection: OK"

      - name: Build the staging app image
        run: |
          docker compose -f docker-compose.staging.yml -p austro-staging \
            --env-file .env.staging build app

      - name: Build the staging backup image
        run: |
          docker compose -f docker-compose.staging.yml -p austro-staging \
            --env-file .env.staging build backup

      - name: The backup image ships a matching pg_dump
        run: |
          set -o pipefail
          docker compose -f docker-compose.staging.yml -p austro-staging \
            --env-file .env.staging run --rm --no-deps \
            --entrypoint sh backup -c "pg_dump --version" | tee /tmp/pgdump.txt
          grep -qE "pg_dump \(PostgreSQL\) 16\." /tmp/pgdump.txt || {
            echo "ERROR: pg_dump must match the PostgreSQL 16 target"; exit 1; }
          echo "backup image pg_dump: OK"

      - name: Print the staging validation plan
        run: python scripts/staging_validate.py

      - name: Staging rollback is refused outside staging
        run: |
          printf 'AUSTRO_ENVIRONMENT=production\n' > .env.prod-guard
          if python scripts/staging_rollback.py --env-file .env.prod-guard \
               --image austro-staging-app:5f0d604 --plan; then
            echo "ERROR: a non-staging environment was not refused"; exit 1
          fi
          if python scripts/staging_rollback.py --env-file .env.staging \
               --image austro-ai-app:main --plan; then
            echo "ERROR: a production image was not refused"; exit 1
          fi
          if python scripts/staging_rollback.py --env-file .env.staging \
               --image austro-staging-app:local --plan; then
            echo "ERROR: an unidentifiable image was not refused"; exit 1
          fi
          echo "rollback guards: OK"

  # ----------------------------------------------------------------------- #
  # Encrypted backup + disposable restore, proven end to end in CI.
  # Everything is created by this job: an ephemeral postgres:16 service, a
  # random 32-byte key generated on the runner, and two disposable databases.
  # No developer secret file, no pre-provisioned database, no paid service.
  # ----------------------------------------------------------------------- #
  backup-integration:
    name: Encrypted backup and disposable restore (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: austro_ai_ci_source
          POSTGRES_USER: austro
          POSTGRES_PASSWORD: austro_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U austro -d austro_ai_ci_source"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      CI_DB_HOST: 127.0.0.1
      CI_DB_PORT: "5432"
      CI_DB_ADMIN_USER: austro
      CI_DB_ADMIN_PASSWORD: austro_ci
      CI_SOURCE_DB: austro_ai_ci_source
      CI_RESTORE_TARGET: austro_ai_restore_ci
      CI_APP_ROLE: austro_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (fixture helper needs psycopg2)
        run: pip install -r requirements-dev.txt

      - name: Generate ephemeral secrets on the runner (values never printed)
        run: |
          set -euo pipefail
          umask 077
          D="${RUNNER_TEMP}/backup-ci"
          rm -rf "$D"
          mkdir -p "$D/keys" "$D/out"
          head -c 32 /dev/urandom > "$D/keys/backup.key"
          head -c 32 /dev/urandom > "$D/keys/wrong.key"
          chmod 0400 "$D/keys/backup.key" "$D/keys/wrong.key"
          test "$(stat -c %s "$D/keys/backup.key")" -eq 32
          test "$(stat -c %s "$D/keys/wrong.key")" -eq 32
          APP_PW="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$APP_PW"
          {
            echo "BACKUP_CI_DIR=$D"
            echo "CI_APP_PASSWORD=$APP_PW"
          } >> "$GITHUB_ENV"
          echo "ephemeral 32-byte backup key and wrong key generated (not printed)"

      - name: Build the real backup image
        run: docker build -f Dockerfile.backup -t austro-backup:ci .

      - name: The built image imports cryptography and psycopg2
        run: |
          set -euo pipefail
          out="$(docker run --rm --entrypoint python austro-backup:ci -c 'import cryptography, psycopg2; from cryptography.hazmat.primitives.ciphers.aead import AESGCM; print("cryptography", cryptography.__version__, "psycopg2", psycopg2.__version__, "AESGCM ok")')"
          echo "$out"
          echo "$out" | grep -q "^cryptography .* AESGCM ok$"

      - name: Seed disposable source database, restore target and app role
        run: python scripts/ci_backup_fixture.py seed --expected "$BACKUP_CI_DIR/expected.json"

      - name: Encrypted backup (pg_dump -> AES-256-GCM, key from read-only secret)
        run: bash scripts/ci_backup_integration.sh backup

      - name: Wrong key is refused before any database change
        run: bash scripts/ci_backup_integration.sh restore-wrong-key

      - name: Tampered archive is refused before any database change
        run: bash scripts/ci_backup_integration.sh restore-tampered

      - name: Unsafe restore targets and missing authorisation are refused
        run: bash scripts/ci_backup_integration.sh restore-refused

      - name: Restore into the disposable database with the correct key
        run: bash scripts/ci_backup_integration.sh restore

      - name: Remove ephemeral keys and working files
        if: always()
        run: |
          if [ -n "${BACKUP_CI_DIR:-}" ]; then
            bash scripts/ci_backup_integration.sh cleanup
          else
            echo "nothing to clean: secrets step did not run"
          fi
          if [ -n "${BACKUP_CI_DIR:-}" ] && [ -e "$BACKUP_CI_DIR" ]; then
            echo "ERROR: ephemeral directory still present"; exit 1
          fi

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run dependency audit
        run: pip-audit -r requirements.txt -r requirements-dev.txt --format=json --output=audit-report.json
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-report
          path: audit-report.json

  performance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run performance tests
        env:
          BOT_TOKEN: "123456789:ABCdefghIJKlmnoPQRstuvwxyz-DummyToken"
          GEMINI_API_KEY: ""
        run: python tests/test_performance.py
