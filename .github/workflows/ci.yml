name: CI\n\non:\n  push:\n    branches: ["**"]\n  pull_request:\n\n# Least privilege: no job in this workflow writes to the repository.\npermissions:\n  contents: read\n\njobs:\n  test:\n    runs-on: ubuntu-latest\n    env:\n      BOT_TOKEN: "123456789:ABCdefghIJKlmnoPQRstuvwxyz-DummyToken"\n      GEMINI_API_KEY: ""\n    strategy:\n      matrix:\n        python-version: ["3.12"]\n    services:\n      postgres:\n        image: postgres:16\n        env:\n          POSTGRES_DB: austro_ai\n          POSTGRES_USER: austro\n          POSTGRES_PASSWORD: austro_ci\n        ports:\n          - 5432:5432\n        options: >-\n          --health-cmd="pg_isready -U austro -d austro_ai"\n          --health-interval=10s\n          --health-timeout=5s\n          --health-retries=5\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          fetch-depth: 0\n\n      - uses: actions/setup-python@v5\n        with:\n          python-version: ${{ matrix.python-version }}\n\n      - name: Install dependencies\n        run: pip install -r requirements-dev.txt\n\n      - name: Byte-compile all modules\n        run: python -m compileall -q app main.py handlers.py config.py database.py reminder_scheduler.py redaction.py smoke_test.py scripts tests\n\n      - name: Lint with pyflakes\n        run: python -m pyflakes main.py handlers.py config.py database.py reminder_scheduler.py redaction.py app tests scripts/staging_validate.py scripts/staging_rollback.py\n\n      - name: Run tests\n        run: pytest -v\n\n      - name: Run Bandit SAST scan\n        run: bandit -r app/ --lll -f sarif -o bandit-report.sarif || true\n\n\n      - name: Run offline smoke test\n        run: python smoke_test.py\n\n      - name: Run PostgreSQL integration tests\n        env:\n          DB_HOST: localhost\n          DB_PORT: 5432\n          DB_USER: austro\n          DB_PASSWORD: austro_ci\n          DB_TEST_NAME: austro_ai_pgtest\n          DB_ADMIN_USER: austro\n          DB_ADMIN_PASSWORD: austro_ci\n        run: |\n          set -o pipefail\n          python -m pytest tests/test_repositories_pg.py -q --tb=short 2>&1 | tee /tmp/pg_results.log\n          grep -q "18 passed" /tmp/pg_results.log || { echo "ERROR: Expected 18 passed"; exit 1; }\n          grep -q "skipped" /tmp/pg_results.log && { echo "ERROR: Tests were skipped"; exit 1; } || true\n          echo "PostgreSQL integration tests: 18 passed, 0 skipped"\n\n      - name: Run evaluation regression harness\n        env:\n          BOT_TOKEN: "123456789:ABCdefghIJKlmnoPQRstuvwxyz-DummyToken"\n          GEMINI_API_KEY: ""\n        run: python scripts/verify.py\n\n      # This step previously ran `pytest tests/test_security.py || echo skip`.\n      # tests/test_security.py does not exist in the tree, so the `||` branch\n      # always ran and CI reported success for a suite that never executed.\n      # The security surface is now covered by files that DO exist, and the\n      # step fails loudly if any of them goes missing.\n      - name: Security tests\n        run: |\n          set -o pipefail\n          files=(\n            tests/test_redaction.py\n            tests/test_docker_context.py\n            tests/test_architecture.py\n            tests/test_production_config.py\n          )\n          for f in "${files[@]}"; do\n            if [ ! -f "$f" ]; then\n              echo "ERROR: expected security test file is missing: $f"\n              exit 1\n            fi\n          done\n          python -m pytest "${files[@]}" -v\n\n      - name: Repository secret scan\n        uses: trufflesecurity/trufflehog@v3.97.9\n        with:\n          path: ./\n          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}\n          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}\n          extra_args: --only-verified\n\n  staging:\n    name: Staging stack (compose + images)\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n\n      - name: Install dependencies\n        run: pip install -r requirements-dev.txt\n\n      # Non-secret stand-ins so `${VAR:?}` interpolation resolves. Never a real\n      # credential: CI only needs compose to resolve and Docker to build.\n      - name: Create a sanitized staging env file for CI\n        run: |\n          cp .env.staging.example .env.staging\n          cat >> .env.staging <<'EOF'\n          AUSTRO_ENVIRONMENT=staging\n          BOT_TOKEN=000000000:CI-placeholder-not-a-real-token\n          GEMINI_API_KEY=ci-placeholder-key\n          DB_HOST=staging-db.internal.example\n          DB_NAME=austro_ai_staging\n          DB_USER=austro_staging\n          DB_PASSWORD=ci-placeholder-password\n          WEBHOOK_SECRET=ci-placeholder-webhook-secret\n          EOF\n          echo "sanitized .env.staging created (placeholder values only)"\n\n      # A synthetic production env file so the isolation check has something to\n      # compare against. Placeholder values only, and deliberately different.\n      - name: Create a sanitized production env stand-in for comparison\n        run: |\n          cat > .env <<'EOF'\n          AUSTRO_ENVIRONMENT=production\n          BOT_TOKEN=111111111:CI-production-placeholder-token\n          GEMINI_API_KEY=ci-production-placeholder-key\n          DB_HOST=prod-db.internal.example\n          DB_NAME=austro_ai\n          DB_USER=austro\n          DB_PASSWORD=ci-production-placeholder-password\n          WEBHOOK_URL=https://example.com/webhook\n          WEBHOOK_SECRET=ci-production-placeholder-webhook-secret\n          EOF\n          echo "sanitized .env stand-in created (placeholder values only)"\n\n      - name: Validate the staging and production compose files\n        run: |\n          docker compose -f docker-compose.staging.yml -p austro-staging \\n            --env-file .env.staging config -q\n          docker compose -f docker-compose.staging.yml -p austro-staging \\n            --env-file .env.staging config --services\n          echo "staging compose config: OK"\n\n      - name: Staging env file must stay untracked\n        run: |\n          if git check-ignore -q .env.staging; then\n            echo ".env.staging is git-ignored: OK"\n          else\n            echo "ERROR: .env.staging is not git-ignored"; exit 1\n          fi\n          if git check-ignore -q .env.staging.example; then\n            echo "ERROR: .env.staging.example must be trackable"; exit 1\n          fi\n          echo ".env.staging.example is trackable: OK"\n\n      - name: Staging isolation preflight (no Docker needed)\n        run: python scripts/staging_validate.py --env-file .env.staging --static\n\n      - name: Staging isolation preflight must reject shared production secrets\n        run: |\n          cp .env.staging .env.staging.bak\n          echo "BOT_TOKEN=111111111:CI-production-placeholder-token" >> .env.staging\n          if python scripts/staging_validate.py --env-file .env.staging --static; then\n            echo "ERROR: a token shared with production was not rejected"; exit 1\n          fi\n          mv .env.staging.bak .env.staging\n          echo "shared-secret rejection: OK"\n\n      - name: Build the staging app image\n        run: |\n          docker compose -f docker-compose.staging.yml -p austro-staging \\n            --env-file .env.staging build app\n\n      - name: Build the staging backup image\n        run: |\n          docker compose -f docker-compose.staging.yml -p austro-staging \\n            --env-file .env.staging build backup\n\n      - name: The backup image ships a matching pg_dump\n        run: |\n          set -o pipefail\n          docker compose -f docker-compose.staging.yml -p austro-staging \\n            --env-file .env.staging run --rm --no-deps \\n            --entrypoint sh backup -c "pg_dump --version" | tee /tmp/pgdump.txt\n          grep -qE "pg_dump \(PostgreSQL\) 16\." /tmp/pgdump.txt || {\n            echo "ERROR: pg_dump must match the PostgreSQL 16 target"; exit 1; }\n          echo "backup image pg_dump: OK"\n\n      - name: Print the staging validation plan\n        run: python scripts/staging_validate.py\n\n      - name: Staging rollback is refused outside staging\n        run: |\n          printf 'AUSTRO_ENVIRONMENT=production\n' > .env.prod-guard\n          if python scripts/staging_rollback.py --env-file .env.prod-guard \\n               --image austro-staging-app:5f0d604 --plan; then\n            echo "ERROR: a non-staging environment was not refused"; exit 1\n          fi\n          if python scripts/staging_rollback.py --env-file .env.staging \\n               --image austro-ai-app:main --plan; then\n            echo "ERROR: a production image was not refused"; exit 1\n          fi\n          if python scripts/staging_rollback.py --env-file .env.staging \\n               --image austro-staging-app:local --plan; then\n            echo "ERROR: an unidentifiable image was not refused"; exit 1\n          fi\n          echo "rollback guards: OK"\n\n  dependency-audit:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - name: Install pip-audit\n        run: pip install pip-audit\n      - name: Run dependency audit\n        run: pip-audit -r requirements.txt -r requirements-dev.txt --format=json --output=audit-report.json\n      - name: Upload audit report\n        uses: actions/upload-artifact@v4\n        with:\n          name: dependency-audit-report\n          path: audit-report.json\n\n  performance-tests:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-python@v5\n        with:\n          python-version: "3.12"\n      - name: Install dependencies\n        run: pip install -r requirements-dev.txt\n      - name: Run performance tests\n        env:\n          BOT_TOKEN: "123456789:ABCdefghIJKlmnoPQRstuvwxyz-DummyToken"\n          GEMINI_API_KEY: ""\n        run: python tests/test_performance.py