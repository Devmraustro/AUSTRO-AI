name: Live Provider Smoke (manual)

on:
  workflow_dispatch:

# Credential/connectivity check only. Never starts the bot or modifies data.
permissions: {}

concurrency:
  group: live-provider-smoke
  cancel-in-progress: false

jobs:
  provider-smoke:
    name: Telegram and OpenRouter API smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check Telegram getMe and OpenRouter chat completion
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import sys
          import urllib.error
          import urllib.request

          failures = []
          token = os.environ.get("BOT_TOKEN", "").strip()
          if not token:
              print("Telegram getMe: FAIL (repository secret BOT_TOKEN missing)")
              failures.append("BOT_TOKEN")
          else:
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/getMe",
                  headers={"Accept": "application/json"},
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      data = json.loads(response.read())
                  if data.get("ok") is True and data.get("result", {}).get("is_bot") is True:
                      print("Telegram getMe: PASS (identity suppressed)")
                  else:
                      print("Telegram getMe: FAIL (unexpected response; body suppressed)")
                      failures.append("Telegram API")
              except urllib.error.HTTPError as exc:
                  print(f"Telegram getMe: FAIL (HTTP {exc.code}; body suppressed)")
                  failures.append("Telegram API")
              except Exception as exc:
                  print(f"Telegram getMe: FAIL ({type(exc).__name__}; details suppressed)")
                  failures.append("Telegram API")

          key = os.environ.get("OPENROUTER_API_KEY", "").strip()
          model = (os.environ.get("OPENROUTER_MODEL") or "google/gemma-4-31b-it:free").strip()
          if not key:
              print("OpenRouter chat completion: FAIL (repository secret OPENROUTER_API_KEY missing)")
              failures.append("OPENROUTER_API_KEY")
          elif not re.fullmatch(r"[A-Za-z0-9._:/-]{1,200}", model):
              print("OpenRouter chat completion: FAIL (invalid model identifier)")
              failures.append("OpenRouter model")
          else:
              payload = json.dumps({
                  "model": model,
                  "messages": [{"role": "user", "content": "Reply with exactly OK."}],
                  "temperature": 0,
                  "max_tokens": 8,
              }).encode("utf-8")
              req = urllib.request.Request(
                  "https://openrouter.ai/api/v1/chat/completions",
                  data=payload,
                  headers={
                      "Authorization": f"Bearer {key}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "HTTP-Referer": "https://github.com/Devmraustro/AUSTRO-AI",
                      "X-Title": "AUSTRO AI live smoke",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = json.loads(response.read())
                  choices = data.get("choices")
                  if isinstance(choices, list) and choices and isinstance(choices[0].get("message"), dict):
                      print(f"OpenRouter chat completion: PASS (model={model}; output suppressed)")
                  else:
                      print("OpenRouter chat completion: FAIL (unexpected response; body suppressed)")
                      failures.append("OpenRouter API")
              except urllib.error.HTTPError as exc:
                  # Do not print response body; it may echo request metadata.
                  print(f"OpenRouter chat completion: FAIL (HTTP {exc.code}; body suppressed)")
                  failures.append("OpenRouter API")
              except Exception as exc:
                  print(f"OpenRouter chat completion: FAIL ({type(exc).__name__}; details suppressed)")
                  failures.append("OpenRouter API")

          if failures:
              print("LIVE PROVIDER SMOKE: FAIL (" + ", ".join(failures) + ")")
              sys.exit(1)
          print("LIVE PROVIDER SMOKE: PASS (both APIs reachable; no Telegram message sent)")
          PY
