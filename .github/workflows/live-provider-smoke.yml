name: Live Provider Smoke (manual)

on:
  workflow_dispatch:
    inputs:
      gemini_model:
        description: "Gemini model to test (one minimal generation request is sent)"
        required: true
        default: "gemini-3.8-flash"
        type: string

# Credential/connectivity check only. Never starts the bot, modifies data, or prints secrets.
permissions:
  contents: read

concurrency:
  group: live-provider-smoke
  cancel-in-progress: false

jobs:
  provider-smoke:
    name: Telegram and Gemini API smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      # The check logic lives in scripts/live_provider_smoke.py so it is
      # unit-tested with mocked HTTP (tests/test_live_provider_smoke.py);
      # this workflow only supplies secrets and the selected model.
      - name: Check Telegram getMe and Gemini generateContent
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model }}
        run: python scripts/live_provider_smoke.py
